services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # 前段プロキシと同一ホストなら APP_BIND=127.0.0.1 で外部からの直接アクセスを遮断できる
      - "${APP_BIND:-0.0.0.0}:3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/specialite_hub?schema=public
      - HOLODEX_API_KEY=${HOLODEX_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY}
      - BYPASS_ADMIN_AUTH=${BYPASS_ADMIN_AUTH}
      - NEXT_PUBLIC_BYPASS_ADMIN_AUTH=${NEXT_PUBLIC_BYPASS_ADMIN_AUTH}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  db:
    image: postgres:15-alpine
    # 本番環境ではDBポートを外部公開しない
    # ports:
    #   - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=specialite_hub
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  cron:
    image: alpine:latest
    environment:
      - TZ=Asia/Tokyo
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY}
    depends_on:
      - app
    restart: always
    entrypoint: >
      sh -c "
      apk add --no-cache curl tzdata &&
      echo '30 4 * * * curl -s -X POST -H \"x-admin-key: $ADMIN_SECRET_KEY\" http://app:3000/api/recommend' >> /etc/crontabs/root &&
      echo '*/5 * * * * curl -s -X POST -H \"x-admin-key: $ADMIN_SECRET_KEY\" http://app:3000/api/live/check' >> /etc/crontabs/root &&
      exec crond -f -l 2
      "


volumes:
  pgdata:
